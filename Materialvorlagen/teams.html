<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat und Besprechung · Materialvorlage</title>
<link rel="stylesheet" href="assets/material-views.css">
</head>
<body>
<div class="source-document">
<div class="app teams" data-material-view="teams" data-material-surface="v2">
  <div class="viewerbar">
    <span class="dots" aria-hidden="true">•••</span>
    <span class="material-app-icon" aria-hidden="true">T</span>
    <strong>Microsoft Teams</strong><span class="file">[Dokumenttitel]</span>
    <span class="material-search" aria-hidden="true">⌕ Suchen</span>
    <span class="grow"></span><span class="material-window-tools" aria-hidden="true">— □ ×</span>
  </div>
  <div class="subbar"><span class="material-tab is-active">Beiträge</span><span class="material-tab">Dateien</span><span class="material-tab">Besprechungsnotizen</span><span class="material-kind">Chat / Besprechung</span></div>
  <div class="material-workspace">
    <aside class="material-rail" aria-hidden="true"><span class="material-rail-title">Zusammenarbeit</span><span class="material-rail-item is-active">Chat</span><span class="material-rail-item">Teams</span><span class="material-rail-item">Kalender</span><span class="material-rail-item">Dateien</span></aside>
    <section class="canvas"><article class="paper"><h1>[Dokumenttitel]</h1><p>[Originalinhalt des Materials unverändert einsetzen.]</p></article></section>
  </div>
</div>
</div>
</body>
</html>
