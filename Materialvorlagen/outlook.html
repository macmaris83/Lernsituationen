<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Mail · Materialvorlage</title>
<link rel="stylesheet" href="assets/material-views.css">
</head>
<body>
<div class="source-document">
<div class="app outlook" data-material-view="outlook" data-material-surface="v2">
  <div class="viewerbar">
    <span class="dots" aria-hidden="true">•••</span>
    <span class="material-app-icon" aria-hidden="true">O</span>
    <strong>Outlook</strong><span class="file">[Dokumenttitel]</span>
    <span class="material-search" aria-hidden="true">⌕ Suchen</span>
    <span class="grow"></span><span class="material-window-tools" aria-hidden="true">— □ ×</span>
  </div>
  <div class="subbar"><span class="material-tab is-active">Nachricht</span><span class="material-tab">Korrespondenz</span><span class="material-kind">E-Mail</span></div>
  <div class="material-workspace">
    <aside class="material-rail" aria-hidden="true"><span class="material-rail-title">E-Mail</span><span class="material-rail-item is-active">Posteingang</span><span class="material-rail-item">Entwürfe</span><span class="material-rail-item">Gesendet</span><span class="material-rail-item">Archiv</span></aside>
    <section class="canvas"><article class="paper"><h1>[Dokumenttitel]</h1><p>[Originalinhalt des Materials unverändert einsetzen.]</p></article></section>
  </div>
</div>
</div>
</body>
</html>
