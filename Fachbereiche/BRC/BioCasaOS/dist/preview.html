<!doctype html>
<html lang="de">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta name="theme-color" content="#002050">
 <meta name="description" content="BioCasa OS: Buchführung, Lager und Controlling verstehen. Eine persönliche Lernumgebung für Moodle.">
 <title>BioCasa OS · Lehrkräftevorschau</title>
 <link rel="stylesheet" href="styles.css">
 <link rel="stylesheet" href="dynamics.css">
 <script src="data-defaults.js" defer></script><script src="data-config.js" defer></script>
 <script src="dataset.js" defer></script>
 <script src="engine.js" defer></script>
 <script src="composer.js" defer></script>
 <script src="didactics.js" defer></script>
 <script src="booking-checks.js" defer></script>
 <script src="flow-player.js" defer></script>
 <script src="course-config.js" defer></script>
 <script src="release.js" defer></script>
 <script src="inventory-cases.js" defer></script>
 <script src="later-lessons.js" defer></script>
 <script src="accounts.js" defer></script>
 <script src="calculator.js" defer></script>
 <script src="learning.js" defer></script>
 <script src="tutorials.js" defer></script>
 <script src="drafts.js" defer></script>
 <script src="curriculum.js" defer></script>
 <script src="teacher-preview.js" defer></script>
 <script src="storage.js" defer></script>
 <script src="app.js" defer></script>
</head>
<body>
 <a class="skip" href="#main">Zum Arbeitsbereich</a>
 <header class="topbar dynamics-shell">
  <button class="ms-app-launcher" data-action="workspace-explorer" aria-label="Dein Profil und Einstellungen öffnen" title="Dein Profil"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M2 2h3v3H2z M8 2h3v3H8z M14 2h3v3h-3z M2 8h3v3H2z M8 8h3v3H8z M14 8h3v3h-3z M2 14h3v3H2z M8 14h3v3H8z M14 14h3v3h-3z"/></svg></button>
  <div class="ms-product"><strong>BioCasa OS</strong><small>Rechnungswesen</small></div>
  <button class="ms-global-search" data-action="command-search" aria-label="Seiten und Aktionen suchen" title="Seiten und Aktionen suchen · Alt+Q"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg><span>Suchen</span><kbd>Alt+Q</kbd></button>
  <div class="top-actions"><button type="button" id="save-status" class="shell-save" data-action="save" aria-label="Übungsstand speichern" title="Übungsstand speichern"></button><span class="period-top">Okt.–Dez. 2026</span><span class="simulation-tag">LERNSIMULATION</span><button class="ms-shell-help" data-nav="help" aria-label="Hilfe zur Lernsimulation">?</button><span class="avatar small" aria-hidden="true">DU</span></div>
 </header>
 <div class="company-banner">
  <div class="brand"><img class="brand-logo" src="assets/biocasa-logo.svg" alt="BioCasa-Logo" width="42" height="42"><span>BioCasa GmbH<span class="brand-tag">FIKTIVES LERNUNTERNEHMEN</span></span></div>
  <div class="company-title"><strong>Rechnungswesen</strong><span>Aurich · Dein Übungsstand</span></div>
  <label class="workspace-mode" for="workspace-mode"><span>Ansicht wählen</span><select id="workspace-mode" aria-label="Ansicht wählen"><option value="learn">Lernen</option><option value="teacher">Lehrkräftemodus</option></select></label>
 </div>
 <div id="storage-warning" role="status" hidden></div>
 <nav id="lesson-navigation" class="lesson-header" aria-label="Lernsituationen" tabindex="-1"></nav>
 <div class="shell">
  <div class="workspace">
   <main id="main" tabindex="-1"></main>
   <footer class="footer"><span>BioCasa OS <span class="version">0.19</span> <span class="footer-dot">·</span> Fiktives Lernunternehmen<small class="footer-product-note">Rechnungswesen verstehen</small></span><span class="school-mark"><img src="assets/bbs1-aurich-white.png" alt="Berufsbildende Schulen 1 Aurich" width="100" height="28"><small>Berufliches Gymnasium · BRC</small></span></footer>
  </div>
 </div>
 <div id="toast" role="status" aria-live="polite" hidden></div>
 <dialog id="booking-focus" class="booking-focus" aria-labelledby="booking-focus-title"><div id="booking-focus-content"></div></dialog>
 <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
 <input id="import-file" type="file" accept=".json,application/json" hidden aria-label="BioCasa-Übungsstand importieren">
 <noscript>Für die Buchungsfunktionen muss JavaScript in Moodle aktiviert sein.</noscript>
</body>
</html>
