  <title id="title">Die Fläche bei Block zeichnen</title>
  <desc id="desc">Leeres Koordinatenfeld, 4,80 m breit und 4,00 m tief. Der Nullpunkt liegt links unten. x wächst nach rechts und y nach oben. Maßstab zum Zeichnen 1:20.</desc>
