<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img" aria-labelledby="title desc"><title id="title">Werbeplätze und ihre Fristen</title><desc id="desc">Jeweils die Frist aus der Vorwoche und den geplanten Einsatz ablesen. Alle vier möglichen Werbeplätze aus M3 stehen nebeneinander vergleichbar in vier Zeilen. Bei der Bike Arena ist beim Aufsteller auch der Liefertermin angegeben.</desc>
