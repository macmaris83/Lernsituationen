<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 655" width="1160" height="655" role="img" aria-labelledby="title desc"><title id="title">Bausteine für zwei Werbemittel</title><desc id="desc">Ein leerer Handyrahmen auf einem A5-Blatt, ein leeres Eingangsschild auf einem A4-Blatt sowie sechs einzelne Papierstreifen. Die Streifen sind noch nicht auf die Werbemittel verteilt.</desc>
