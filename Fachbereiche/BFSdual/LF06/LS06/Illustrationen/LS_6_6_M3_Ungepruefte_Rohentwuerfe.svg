<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" width="1040" height="680" role="img" aria-labelledby="title desc"><title id="title">Rohentwürfe vor der Prüfung</title><desc id="desc">Zwei ungeprüfte Werbeentwürfe. Links ein Newsletter-Entwurf für Block. Rechts ein Eingangsschild-Entwurf für die Bike Arena mit einer schematischen Pumpe mit runder Druckanzeige. Die Wortlaute stehen im Material M3.</desc>
