<text x="110" y="509" fill="#183322" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400" font-size="22" text-anchor="start">Probiert das Zubehör</text>
<text x="110" y="543" fill="#183322" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400" font-size="22" text-anchor="start">vor Ort aus.</text>
