<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor · Büro mit Zukunft</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/editor.css">
<script defer src="assets/editor-config.js"></script><script defer src="assets/editor-settings.js"></script><script defer src="assets/jszip.min.js"></script><script defer src="assets/editor.js"></script></head>
<body class="bfs-editor-page" data-teacher="true" data-office=""><div class="shell"><header class="brand-header"><strong>BFS dual · Global Bike · LS 6.9</strong><div class="bfs-brand-logos"><img src="assets/bbs1-aurich.svg" alt="BBS 1 Aurich"><img src="assets/loept.png" alt="Löppt"></div></header><main class="main">
<div class="editor-intro"><nav aria-label="Editor"><a href="index.html">Zur Lernsituation</a></nav><h1>Editor</h1><p>Büro mit Zukunft</p></div>
<section class="teacher-card" id="teacher-login"><label>PIN<input id="teacher-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label><button id="teacher-unlock" type="button">Öffnen</button><p id="teacher-login-message" role="status"></p></section>
<div id="teacher-panel" hidden>
  <div class="editor-toolbar">
    <label class="editor-source-label">Seite<select id="editor-page" data-edit-page disabled></select></label>
    <div class="editor-primary-actions">
      <a class="button" data-preview-page target="_blank" rel="noopener noreferrer" aria-disabled="true">Vorschau</a>
      <button class="button primary" type="button" data-export-ims disabled>SCORM herunterladen</button>
    </div>
    <p data-teacher-status role="status"></p>
  </div>
  <div class="editor-secondary">
    <details><summary>Moodle-Links</summary><div data-moodle-fields></div></details>
    <details id="editor-options">
      <summary>Weitere Optionen</summary>
      <label>SCORM-ZIP öffnen<input type="file" accept=".zip,application/zip" id="editor-source"></label>
      <div class="editor-actions">
        <button type="button" data-reset-page disabled>Diese Seite zurücksetzen</button>
        <a class="button" href="druckansicht.html?bfs-vorschau=1" target="_blank" rel="noopener noreferrer">Druckansicht</a>
      </div>
      <p>Die Druckansicht übernimmt den Entwurf. Die mitgelieferten PDFs zeigen den Stand der Paketvorlage.</p>
    </details>
  </div>
  <div class="editor-workspace">
    <div class="editor-tablist" role="tablist" aria-label="Bearbeitungsbereich" hidden>
      <button type="button" role="tab" id="editor-tab-content" aria-controls="editor-content" aria-selected="true" data-editor-tab="content">Text</button>
      <button type="button" role="tab" id="editor-tab-media" aria-controls="editor-media" aria-selected="false" tabindex="-1" data-editor-tab="media">Bilder</button>
      <button type="button" role="tab" id="editor-tab-links" aria-controls="editor-links" aria-selected="false" tabindex="-1" data-editor-tab="links">Links</button>
      <button type="button" role="tab" id="editor-tab-checks" aria-controls="editor-checks" aria-selected="false" tabindex="-1" data-editor-tab="checks">Checks</button>
    </div>
    <div id="editor-fields">
      <label class="editor-filter" hidden>Textfelder filtern<input type="search" id="editor-filter" autocapitalize="none"></label>
      <div id="editor-content" role="tabpanel" aria-labelledby="editor-tab-content"></div>
      <div id="editor-media" role="tabpanel" aria-labelledby="editor-tab-media" hidden></div>
      <div id="editor-links" role="tabpanel" aria-labelledby="editor-tab-links" hidden></div>
      <div id="editor-checks" role="tabpanel" aria-labelledby="editor-tab-checks" hidden></div>
      <p data-editor-empty hidden></p>
    </div>
  </div>
</div>

</main></div></body></html>
