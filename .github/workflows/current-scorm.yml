name: Aktuelle SCORM-Pakete

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'Downloads/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-scorm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    uses: ./.github/workflows/form185.yml
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auf tradierten Lernweg umstellen und W1-Inhalte prüfen
        run: |
          python3 tools/migrate_traditional_paths.py
          python3 tools/task_slimming.py
          python3 tools/check_traditional_paths.py
      - name: Gemeinsamen Formmaster auf alle Lernsituationen anwenden
        run: python3 tools/form_master.py sync
      - name: Tatsächlich registrierte Fachbereiche und Vorlagen anzeigen
        run: python3 tools/form_master.py inventory
      - name: Exportwerkzeug prüfen
        run: |
          python3 -m unittest discover -s tools -p 'test_master.py'
          python3 -m unittest discover -s tools -p 'test_form_master.py'
          python3 tools/form_master.py check
      - name: Abschluss und Wiederaufnahme in Geschichte prüfen
        run: node tools/test_idn_completion.cjs
      - name: Abschluss aller Lernsituationsvarianten prüfen
        run: node tools/test_form185.cjs
      - name: Geschichte auf einen Lernweg und höchstens vier Aufgaben prüfen
        run: python3 tools/check_history_simplification.py
      - name: Master und Manifest-Dateien prüfen
        run: python3 tools/master.py check

  update-current:
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/')
    needs: [check, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Auf tradierten Lernweg umstellen und W1-Inhalte prüfen
        run: |
          python3 tools/migrate_traditional_paths.py
          python3 tools/task_slimming.py
          python3 tools/check_traditional_paths.py
      - name: Tatsächlich ausgecheckten Stand prüfen
        run: |
          python3 tools/form_master.py sync
          python3 -m unittest discover -s tools -p 'test_master.py'
          python3 -m unittest discover -s tools -p 'test_form_master.py'
          node tools/test_form185.cjs
          python3 tools/form_master.py check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PDF-Werkzeuge bereitstellen
        run: |
          npm install --prefix /tmp/form185-tests playwright@1.56.1
          /tmp/form185-tests/node_modules/.bin/playwright install --with-deps chromium
          python3 -m venv /tmp/current-task-pdfs-venv
          /tmp/current-task-pdfs-venv/bin/pip install pymupdf==1.26.6
      - name: Arbeitshefte aus den aktuellen Aufgaben erneuern und prüfen
        env:
          NODE_PATH: /tmp/form185-tests/node_modules
          PYTHON: /tmp/current-task-pdfs-venv/bin/python
        run: node tools/build_current_task_pdfs.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-task-pdfs
          path: test-results/current-task-pdfs
      - name: Aktuelle Einzelpakete erzeugen
        run: python3 tools/master.py export --all
      - name: Paketinhalt und Prüfsummen prüfen
        run: python3 tools/master.py check --archives
      - name: Aktuelle Downloads übernehmen
        run: |
          git add Downloads Fachbereiche Vorlagen tools master-katalog.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Gemeinsamen Formmaster und aktuelle SCORM-Exporte übernehmen'
          git push origin "HEAD:${GITHUB_REF_NAME}"
