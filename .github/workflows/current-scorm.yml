name: Aktuelle SCORM-Pakete

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'Downloads/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-scorm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exportwerkzeug prüfen
        run: python3 -m unittest discover -s tools -p 'test_master.py'
      - name: Master und Manifest-Dateien prüfen
        run: python3 tools/master.py check

  update-current:
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Tatsächlich ausgecheckten Stand prüfen
        run: python3 -m unittest discover -s tools -p 'test_master.py'
      - name: Nur betroffene Einzelpakete erzeugen und prüfen
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 tools/export_changed_masters.py --base "$BEFORE_SHA"
      - name: Freigegebene Referenz 1.8.1 automatisch erzeugen
        run: python3 tools/update_footer_v181.py
      - name: Paketinhalt und Prüfsummen prüfen
        run: python3 tools/master.py check
      - name: Aktuelle Downloads übernehmen
        run: |
          git add Downloads Lieferungen/BioCasa_LG01/BRC_LG01_LS04_v1.8.1_SCORM12.zip Lieferungen/BioCasa_LG01/BioCasa_LG01_LS04-LS06_v1.8.1.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Aktuelle SCORM-Exporte aus den gepflegten Mastern übernehmen'
          git push origin "HEAD:${GITHUB_REF_NAME}"
