name: Gemeinsamer Lernsituationsmaster
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Auf tradierten Lernweg umstellen und W1-Inhalte prüfen
        run: |
          python3 tools/migrate_traditional_paths.py
          python3 tools/task_slimming.py
          python3 tools/check_traditional_paths.py
      - name: Gemeinsamen Formmaster anwenden und prüfen
        run: |
          python3 tools/form_master.py sync
          python3 tools/form_master.py check
          python3 -m unittest discover -s tools -p 'test_form_master.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abschluss, Fehlerfälle und Wiederaufnahme aller Lernsituationen
        run: node tools/test_form185.cjs
      - name: Browser-Testwerkzeug bereitstellen
        run: |
          npm install --prefix /tmp/form185-tests playwright@1.56.1
          /tmp/form185-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Orientierung, Aufgabenfokus, Materialrücksprung und Abschluss prüfen
        env:
          NODE_PATH: /tmp/form185-tests/node_modules
        run: node tools/test_form185_browser.cjs
      - name: Materialoberflächen und unveränderte Materialtexte prüfen
        if: always()
        env:
          NODE_PATH: /tmp/form185-tests/node_modules
        run: node tools/test_material_surfaces.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: form185-browser
          path: test-results/form185
